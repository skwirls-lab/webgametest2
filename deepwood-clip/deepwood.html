<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deepwood</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}
#c{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100vw,177.78vh);height:min(56.25vw,100vh);cursor:pointer}
#h{position:absolute;left:0;right:0;bottom:10px;text-align:center;font:13px/1.4 monospace;color:#9ab;opacity:.9;pointer-events:none;transition:opacity 1s;text-shadow:0 0 4px #000}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas><div id="h"></div>
<script>
'use strict';
/* ============ CORE: maths, ink engine, halftone, print post-process ============ */
const W = 1920, H = 1080, FPS = 24, DUR = 12, TAU = Math.PI * 2, INK = '#06060c';
const lerp = (a, b, k) => a + (b - a) * k;
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const smooth = k => k * k * (3 - 2 * k);
const eOut = k => 1 - Math.pow(1 - k, 3), eIn = k => k * k * k;
const eIO = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const eBack = k => { const c = 1.70158; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
function rng(s) { let a = s >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash(x, y = 0) { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); }
function n1(x, k = 7.3) { const i = Math.floor(x), f = x - i; return lerp(hash(i, k), hash(i + 1, k), smooth(f)) * 2 - 1; }
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
function shade(hex, k) { // k<1 darken, k>1 lighten
  const n = parseInt(hex.slice(1), 16), f = v => Math.round(clamp(k <= 1 ? v * k : v + (255 - v) * (k - 1), 0, 255));
  return 'rgb(' + f(n >> 16) + ',' + f(n >> 8 & 255) + ',' + f(n & 255) + ')';
}

let g = null;            // current drawing context
let BOIL = 0, JIT = 0;   // hand-drawn line boil (changes "on twos")

/* smooth closed/open path through points; a 3rd element =1 marks a sharp corner */
function sp(pts, closed = true) {
  const n = pts.length, P = new Array(n);
  for (let i = 0; i < n; i++) {
    const p = pts[i]; let x = p[0], y = p[1];
    if (JIT) { x += (hash(p[0] * .37 + BOIL, p[1] * .61) - .5) * JIT; y += (hash(p[1] * .43 - BOIL, p[0] * .29) - .5) * JIT; }
    P[i] = [x, y, p[2] || 0];
  }
  const tan = i => {
    const p = P[i]; if (p[2]) return [0, 0]; let a, b;
    if (closed) { a = P[(i - 1 + n) % n]; b = P[(i + 1) % n]; } else { a = P[Math.max(0, i - 1)]; b = P[Math.min(n - 1, i + 1)]; }
    return [(b[0] - a[0]) / 6, (b[1] - a[1]) / 6];
  };
  g.moveTo(P[0][0], P[0][1]);
  const m = closed ? n : n - 1;
  for (let i = 0; i < m; i++) {
    const j = (i + 1) % n, t0 = tan(i), t1 = tan(j);
    g.bezierCurveTo(P[i][0] + t0[0], P[i][1] + t0[1], P[j][0] - t1[0], P[j][1] - t1[1], P[j][0], P[j][1]);
  }
  if (closed) g.closePath();
}
function poly(pts) { g.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]); g.closePath(); }
/* Catmull-Rom resample */
function cr(pts, n) {
  const out = [], m = pts.length - 1;
  for (let k = 0; k <= n; k++) {
    const u = k / n * m, i = Math.min(m - 1, Math.floor(u)), f = u - i;
    const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(m, i + 2)];
    const q = d => .5 * ((2 * p1[d]) + (-p0[d] + p2[d]) * f + (2 * p0[d] - 5 * p1[d] + 4 * p2[d] - p3[d]) * f * f + (-p0[d] + 3 * p1[d] - 3 * p2[d] + p3[d]) * f * f * f);
    out.push([q(0), q(1)]);
  }
  return out;
}
/* outline polygon of a variable-width tube along a centreline */
function tube(cl, wf) {
  const n = cl.length, L = [], R = [];
  for (let i = 0; i < n; i++) {
    const a = cl[Math.max(0, i - 1)], b = cl[Math.min(n - 1, i + 1)];
    let dx = b[0] - a[0], dy = b[1] - a[1]; const d = Math.hypot(dx, dy) || 1; dx /= d; dy /= d;
    const w = wf(i / (n - 1)) * .5;
    L.push([cl[i][0] - dy * w, cl[i][1] + dx * w]); R.push([cl[i][0] + dy * w, cl[i][1] - dx * w]);
  }
  return L.concat(R.reverse());
}
/* tapered brush-pen stroke. tp: 3 both ends, 2 tail, 1 head, 0 none */
function stroke(pts, w, col = INK, tp = 3) {
  const cl = pts.length < 7 ? cr(pts.length == 2 ? [pts[0], [(pts[0][0] + pts[1][0]) / 2, (pts[0][1] + pts[1][1]) / 2], pts[1]] : pts, 9) : pts;
  const wf = k => w * (tp == 3 ? Math.pow(Math.sin(Math.PI * clamp(k, .03, .97)), .6) : tp == 2 ? Math.pow(1 - k, .7) + .06 : tp == 1 ? Math.pow(k, .7) + .06 : 1);
  g.fillStyle = col; g.beginPath(); sp(tube(cl, wf)); g.fill();
}
function cap(x1, y1, x2, y2, w1, w2) {
  const dx = x2 - x1, dy = y2 - y1, d = Math.hypot(dx, dy) || 1, ux = dx / d, uy = dy / d, nx = -uy, ny = ux; w1 /= 2; w2 /= 2;
  return [[x1 + nx * w1, y1 + ny * w1], [x2 + nx * w2, y2 + ny * w2], [x2 + ux * w2, y2 + uy * w2], [x2 - nx * w2, y2 - ny * w2], [x1 - nx * w1, y1 - ny * w1], [x1 - ux * w1, y1 - uy * w1]];
}
function ell(cx, cy, rx, ry, rot = 0, n = 10) {
  const o = [], c = Math.cos(rot), s = Math.sin(rot);
  for (let i = 0; i < n; i++) { const a = i / n * TAU, x = Math.cos(a) * rx, y = Math.sin(a) * ry; o.push([cx + x * c - y * s, cy + x * s + y * c]); }
  return o;
}

/* ---- halftone ---- */
const _ht = {};
function HT(col, cell = 9, r = .34) {
  const k = col + cell + '_' + r; if (_ht[k]) return _ht[k];
  const c = mk(cell * 2, cell * 2), x = c.getContext('2d'); x.fillStyle = col; const R = cell * r, s = cell * 2;
  for (const [px, py] of [[0, 0], [s, 0], [0, s], [s, s], [s / 2, s / 2]]) { x.beginPath(); x.arc(px, py, R * 1.42, 0, TAU); x.fill(); }
  return _ht[k] = g.createPattern(c, 'repeat');
}
/* gradient halftone field: fn(x,y) -> 0..1 dot size */
function dots(x0, y0, x1, y1, cell, fn, col) {
  g.fillStyle = col; g.beginPath(); let row = 0;
  for (let y = y0; y <= y1; y += cell / 2, row++)
    for (let x = x0 + (row & 1 ? cell / 2 : 0); x <= x1; x += cell) {
      const r = fn(x, y) * cell * .5; if (r > .5) { g.moveTo(x + r, y); g.arc(x, y, r, 0, TAU); }
    }
  g.fill();
}

/* ---- the cel/ink shape primitive ----
   thick variable-weight outline, flat fill, halftone + spotted-black shadow crescents, rim lights */
const LT = { sx: .55, sy: -.83, ht: '#0d1433', tone: 'rgba(9,12,44,.5)', bk: INK, lights: [{ x: .55, y: -.83, col: '#dbe6ff', k: 1 }] };
function shape(path, o = {}) {
  const m = g.getTransform(), sc = Math.hypot(m.a, m.b), ow = o.ow ?? 5, lx = LT.sx, ly = LT.sy;
  const at = (dx, dy) => g.setTransform(m.a, m.b, m.c, m.d, m.e + dx, m.f + dy);
  g.save();
  if (ow > 0) {
    g.lineJoin = 'round'; g.lineCap = 'round'; g.strokeStyle = o.ink || INK;
    const d = ow * sc * .5; at(-lx * d, -ly * d); g.lineWidth = ow * 1.9; g.beginPath(); path(); g.stroke();
    at(0, 0); g.lineWidth = ow * 1.25; g.beginPath(); path(); g.stroke();
  }
  at(0, 0); g.beginPath(); path(); g.fillStyle = o.fill; g.fill();
  if (!o.flat) {
    g.clip();
    const cres = (dx, dy, style) => {
      g.beginPath(); g.setTransform(1, 0, 0, 1, 0, 0); g.rect(-6000, -6000, 16000, 16000);
      at(dx, dy); path(); g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = style; g.fill('evenodd');
    };
    const s = (o.sh ?? 14) * sc;
    if (s > 0) { cres(lx * s * 1.5, ly * s * 1.5, HT(o.htc || LT.ht, o.cell || 9, .3)); cres(lx * s * .8, ly * s * .8, LT.tone); }
    const b = (o.bk ?? 5) * sc; if (b > 0) cres(lx * b, ly * b, LT.bk);
    const rw = (o.rw ?? 4) * sc;
    if (rw > 0) for (const l of LT.lights) { const r = rw * l.k; if (r > .4) cres(-l.x * r, -l.y * r, l.col); }
  }
  g.restore();
}
/* clip to a path, run fn in clipped state */
function inside(path, fn) { g.save(); g.beginPath(); path(); g.clip(); fn(); g.restore(); }
function glow(x, y, r, col, a = 1) {
  const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, col); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.save(); g.globalCompositeOperation = 'lighter'; g.globalAlpha = a; g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2); g.restore();
}

/* ---- comic SFX lettering built from strokes (no fonts) ---- */
const GLY = {
  K: [[[0, 0], [0, 1]], [[.8, 0], [.05, .55], [.85, 1]]],
  R: [[[0, 1], [0, 0], [.7, 0], [.82, .25], [.7, .5], [0, .5]], [[.35, .5], [.85, 1]]],
  A: [[[0, 1], [.45, 0], [.9, 1]], [[.2, .64], [.7, .64]]],
  H: [[[0, 0], [0, 1]], [[.8, 0], [.8, 1]], [[0, .5], [.8, .5]]],
  '!': [[[.25, 0], [.2, .62]], [[.18, .88], [.18, 1]]]
};
function sfx(txt, x, y, size, o = {}) {
  const r = rng(o.seed || 5); g.save(); g.translate(x, y); g.rotate(o.rot || 0); g.transform(1, 0, o.skew ?? -.25, 1, 0, 0);
  g.lineJoin = 'miter'; g.miterLimit = 6; g.lineCap = 'square';
  const L = [...txt].map((ch, i) => ({ ch, x: i * size * (o.sp || .95), y: (r() - .5) * size * .22 + (o.arc || 0) * Math.pow(i - (txt.length - 1) / 2, 2), s: size * (1 + (o.grow || 0) * i) * (.9 + r() * .2), a: (r() - .5) * .22 }));
  const pass = (lw, col, dx, dy) => {
    g.strokeStyle = col;
    for (const l of L) {
      g.save(); g.translate(l.x + dx, l.y + dy); g.rotate(l.a); g.lineWidth = lw * l.s;
      for (const pl of GLY[l.ch] || []) { g.beginPath(); pl.forEach((p, i) => i ? g.lineTo(p[0] * l.s * .78, (p[1] - .5) * l.s) : g.moveTo(p[0] * l.s * .78, (p[1] - .5) * l.s)); g.stroke(); }
      g.restore();
    }
  };
  pass(.34, INK, size * .05, size * .06); pass(.32, INK, 0, 0); pass(.19, o.col || '#fff', 0, 0);
  if (o.col2) pass(.07, o.col2, -size * .01, -size * .015);
  g.restore();
}

/* ---- print post-process: paint texture, grain, vignette, colour misregistration ---- */
const SB = mk(W, H), CR_ = mk(W, H), CG_ = mk(W, H);
let TEX, GRAIN, VIG;
function buildPost() {
  const r = rng(99);
  TEX = mk(W, H); let x = TEX.getContext('2d'); x.fillStyle = '#808080'; x.fillRect(0, 0, W, H);
  for (let i = 0; i < 2600; i++) { // long dry-brush strokes
    const px = r() * W, py = r() * H, len = 80 + r() * 420, a = -.35 + (r() - .5) * .5, v = r() < .5 ? 255 : 0;
    x.save(); x.translate(px, py); x.rotate(a); x.fillStyle = 'rgba(' + v + ',' + v + ',' + v + ',' + (.025 + r() * .05) + ')';
    const hw = 3 + r() * 22; for (let j = 0; j < 5; j++) x.fillRect(-len / 2 + r() * 30, -hw + j * hw * .4 + r() * 3, len - r() * 80, hw * .3);
    x.restore();
  }
  GRAIN = mk(512, 512); x = GRAIN.getContext('2d'); const id = x.createImageData(512, 512);
  for (let i = 0; i < id.data.length; i += 4) { const v = 128 + (r() - .5) * 90; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
  x.putImageData(id, 0, 0);
  VIG = mk(W, H); x = VIG.getContext('2d'); const gr = x.createRadialGradient(W / 2, H / 2, H * .42, W / 2, H / 2, H * 1.08);
  gr.addColorStop(0, 'rgba(0,0,8,0)'); gr.addColorStop(1, 'rgba(0,0,8,.82)'); x.fillStyle = gr; x.fillRect(0, 0, W, H);
}
function present(out, mis, f) {
  const s = SB.getContext('2d'); s.setTransform(1, 0, 0, 1, 0, 0);
  s.globalCompositeOperation = 'overlay'; s.globalAlpha = .7; s.drawImage(TEX, 0, 0);
  s.globalAlpha = .5; const ox = Math.floor(hash(f, 1) * 512), oy = Math.floor(hash(f, 2) * 512);
  for (let y = -oy; y < H; y += 512) for (let x = -ox; x < W; x += 512) s.drawImage(GRAIN, x, y);
  s.globalAlpha = 1; s.globalCompositeOperation = 'source-over'; s.drawImage(VIG, 0, 0);
  for (const [c, col] of [[CR_, '#ff0000'], [CG_, '#00ffff']]) {
    const x = c.getContext('2d'); x.globalCompositeOperation = 'copy'; x.drawImage(SB, 0, 0);
    x.globalCompositeOperation = 'multiply'; x.fillStyle = col; x.fillRect(0, 0, W, H);
  }
  out.globalCompositeOperation = 'source-over'; out.fillStyle = '#000'; out.fillRect(0, 0, W, H);
  out.globalCompositeOperation = 'lighter';
  out.drawImage(CR_, mis - 8, -4, W + 16, H + 8); out.drawImage(CG_, -mis * .6 - 8, mis * .45 - 4, W + 16, H + 8);
  out.globalCompositeOperation = 'source-over';
}

/* ============ THE DEEPWOOD: colossal trunks, arching roots, moon shafts, mist ============ */
const PAL = {
  sky0: '#02040a', sky1: '#081028', sky2: '#16244e', sky3: '#2b4079', moon: '#eef3ff',
  far: '#2c3f72', farHi: '#5871b0', far2: '#223160', mid: '#15203f', midHi: '#6d8bd2', near: '#0a1024', nearHi: '#93aeea',
  moss: '#1f4a5e', mossL: '#4c8f9c', vio: '#9a45ff', vioL: '#d6adff', vioD: '#48188c', azure: '#19a8ff', azL: '#9fe8ff'
};
const TIER = {
  far: { fill: PAL.far, hi: PAL.farHi, ow: 3, bark: .35, htc: '#16224a', ink: '#0d1634' },
  far2: { fill: PAL.far2, hi: '#4a63a4', ow: 4, bark: .6, htc: '#0f1838', ink: '#090f26' },
  mid: { fill: PAL.mid, hi: PAL.midHi, ow: 6, bark: 1, htc: '#070b1c' },
  near: { fill: PAL.near, hi: PAL.nearHi, ow: 8, bark: 1, htc: '#04060f' }
};
function layer(w, h, fn) { const c = mk(w, h), pg = g; g = c.getContext('2d'); fn(g); g = pg; return c; }
function mist(x, y, rx, ry, col, a) {
  g.save(); g.translate(x, y); g.scale(1, ry / rx); const gr = g.createRadialGradient(0, 0, 0, 0, 0, rx);
  gr.addColorStop(0, col); gr.addColorStop(.5, shade(col, .45)); gr.addColorStop(1, '#000');
  g.globalCompositeOperation = 'screen'; g.globalAlpha = a; g.fillStyle = gr; g.fillRect(-rx, -rx, rx * 2, rx * 2); g.restore();
}
function ray(x0, w0, x1, w1, y0, y1, a, col = '#a9c2ff') {
  const P = [[x0, y0], [x0 + w0, y0], [x1 + w1, y1], [x1, y1]];
  g.save(); g.globalCompositeOperation = 'screen'; g.globalAlpha = a;
  const gr = g.createLinearGradient(x0, y0, x1, y1); gr.addColorStop(0, col); gr.addColorStop(.55, shade(col, .45)); gr.addColorStop(1, '#000');
  g.fillStyle = gr; g.beginPath(); poly(P); g.fill();
  g.clip(); g.globalAlpha = a * .8;
  dots(Math.min(x0, x1), y0, Math.max(x0 + w0, x1 + w1), y1, 14, (x, y) => { const k = (y - y0) / (y1 - y0); return clamp(.75 - k * .9) * (.5 + .5 * Math.sin(x * .013 + y * .004)); }, col);
  g.restore();
}
function sky(w, h, mx, my, mr) {
  const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, PAL.sky0); gr.addColorStop(.4, PAL.sky1); gr.addColorStop(.78, PAL.sky2); gr.addColorStop(1, PAL.sky3);
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  if (mr) {
    glow(mx, my, mr * 9, 'rgba(70,100,200,.6)'); glow(mx, my, mr * 3.2, 'rgba(190,210,255,.7)');
    g.save(); g.beginPath(); g.arc(mx, my, mr, 0, TAU); g.fillStyle = PAL.moon; g.fill(); g.clip();
    const r = rng(8); g.fillStyle = '#c4d0f0'; for (let i = 0; i < 9; i++) { g.beginPath(); g.arc(mx + (r() - .5) * mr * 1.6, my + (r() - .5) * mr * 1.6, mr * (.08 + r() * .2), 0, TAU); g.fill(); }
    dots(mx - mr, my - mr, mx + mr, my + mr, 8, (x, y) => clamp(((mx - x) + (y - my)) / mr * .45), '#9fb0de');
    g.restore();
    g.lineWidth = 4; g.strokeStyle = '#fff'; g.beginPath(); g.arc(mx, my, mr, 0, TAU); g.stroke();
  }
}
function canopy(x0, x1, y, depth, seed, col, n) {
  const r = rng(seed); g.fillStyle = col; g.beginPath();
  for (let i = 0; i < n; i++) {
    const x = lerp(x0, x1, r()), yy = y + Math.pow(r(), 2.2) * depth * (.6 + .4 * Math.sin(x * .004 + seed)), a = (r() - .5) * 2, rx = 14 + r() * 34, ry = rx * (.3 + r() * .25);
    g.ellipse(x, yy, rx, ry, a, 0, TAU); g.closePath();
  }
  g.fill();
}
/* one colossal trunk with buttress roots, bark inks, halftone shadow side, moonlit side */
function trunk(x, w, base, top, T, o = {}) {
  const r = rng(o.seed || 1), lean = o.lean || 0, fl = w * (o.flare ?? .42), xl = x - w / 2, xr = x + w / 2, hgt = base - top;
  const jx = () => (r() - .5) * w * .05;
  const pts = [[xl + lean, top, 1], [xl + lean * .65 + jx(), top + hgt * .35], [xl + lean * .35 + jx(), top + hgt * .65], [xl - fl * .1, base - w * .8], [xl - fl * .5, base - w * .26], [xl - fl, base, 1]];
  const nt = 3 + ((r() * 3) | 0), sx = (w + fl * 2) / nt;
  for (let i = 1; i < nt; i++) { const xx = xl - fl + sx * i; pts.push([xx - sx * .25, base + w * .015], [xx, base - w * (.07 + r() * .13)], [xx + sx * .2, base + w * .01]); }
  pts.push([xr + fl, base, 1], [xr + fl * .5, base - w * .26], [xr + fl * .1, base - w * .8], [xr + lean * .35 + jx(), top + hgt * .65], [xr + lean * .65 + jx(), top + hgt * .35], [xr + lean, top, 1]);
  const path = () => sp(pts), fx = y => lean * clamp(1 - (y - top) / hgt);
  shape(path, { fill: T.fill, ow: T.ow, sh: w * .1, bk: w * .035, rw: w * .022, htc: T.htc, ink: T.ink });
  inside(path, () => {
    // shadow side gradient halftone + spotted blacks
    dots(xl - fl, top, x + w * .2, base, Math.max(9, w * .028), (px, py) => clamp(1.05 - (px - (xl + fx(py))) / (w * .55)) * .95, T.htc);
    const nb = Math.round(w / 11 * T.bark);
    for (let i = 0; i < nb; i++) { // bark: long tapered ink strokes that follow the lean
      const u = r(), y0 = top + r() * hgt * .95, len = hgt * (.08 + r() * .3), wob = (r() - .5) * w * .05;
      const xa = xl + u * w + (y0 > base - w * .8 ? (u - .5) * fl * 1.6 * Math.pow((y0 - (base - w * .8)) / (w * .8), 1.5) : 0);
      const y1 = Math.min(base, y0 + len), sw = (1.5 + r() * w * .014) * (u < .4 ? 1.8 : 1);
      stroke([[xa + fx(y0), y0], [xa + fx((y0 + y1) / 2) + wob, (y0 + y1) / 2], [xa + fx(y1) + (y1 > base - w * .5 ? (u - .5) * fl * .8 : 0), y1]], sw, T.ink || INK);
    }

function flame(x, y, w, h, f, seed, pw) {

    const pts = [[-w * .5 * sc, 0], [-w * .56 * sc, -h * .14 * sc]], n = 5;
    for (let i = 0; i < n; i++) {
      const u = (i - (n - 1) / 2) / ((n - 1) / 2), hh = h * sc * pw * (1 - Math.abs(u) * .45) * (.62 + .6 * hash(i + seed, f)), tx = u * w * .42 * sc + (hash(i, f + seed + 9) - .5) * w * .5 * sc, bx = u * w * .46 * sc;

      if (i < n - 1) pts.push([bx + w * .2 * sc, -h * sc * pw * (.16 + .14 * hash(i, f + 5))]);

  if (u >= 2 && u < 2 + 1 / 24) { g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = .75; g.fillStyle = '#f3e4ff'; g.fillRect(0, 0, W, H); g.globalAlpha = 1; }
  fx.mis = 2 + (u > 2 ? 9 * Math.exp(-rt * 5) + 1 : 0);
}

/* ================= SHOT 4 (9-12s) ================= */
function shot4(t, tc, fx) {
  const HOLD = 2.25, still = t - 9 >= HOLD, u = still ? HOLD : t - 9, uc = still ? HOLD : tc - 9, tcc = 9 + uc, f = Math.floor((9 + u) * 24), f2 = f >> 1, BT = 1.75, db = u - BT, kf = Math.floor(db * 24 + 1e-6);
  const fl = u >= BT ? 1 : 0, gl = eOut(seg(uc, .8, .95)), hd = seg(t - 9 - HOLD, 0, .2);
  const p = {
    brow: lerp(-.75, 1, eIO(seg(uc, .45, .85))), blink: (uc > .5 && uc < .62) ? .5 : 0, glow: gl, veins: seg(uc, .85, 1.75) * .8 + .2 * fl * seg(uc, BT, HOLD) + (gl > 0 ? .02 : 0), teeth: uc > 1.0 ? 1 : 0,
    hands: seg(uc, 1.3, 1.7), flame: fl ? 1 + .35 * Math.exp(-Math.max(0, uc - BT) * 6) : 0, tilt: .05 * (1 - eIO(seg(uc, .45, .9)))
  };
  const z = 1.03 + .07 * eIO(u / HOLD) + (fl ? .03 : 0), sh = shakeV(f, still ? 0 : (fl ? 22 * Math.exp(-db * 5) + 1.5 : 2.2 * seg(u, 0, .5) * (1 - gl) + (u > .8 && u < .95 ? 7 : 0)));
  const vk = 1.7 * (.72 + .28 * hash(f2, 5)) * (1 - .5 * fl);
  lights([MOON, { x: -.96, y: -.28, col: PAL.vio, k: vk }, { x: -.72, y: .69, col: '#39b8ff', k: 1.7 * fl + .45 * gl * (1 - fl) }]);
  LT.ht = fl ? '#061a4d' : '#0d1433';
  const pk = still ? lerp(1, .9, eOut(hd)) : 1;
  g.setTransform(1, 0, 0, 1, 0, 0);
  if (still) { g.fillStyle = '#ecebe4'; g.fillRect(0, 0, W, H); }
  const base = () => { g.setTransform(1, 0, 0, 1, 0, 0); if (still) { g.translate(W / 2, H / 2); g.rotate(-.012 * eOut(hd)); g.scale(pk, pk); g.translate(-W / 2, -H / 2); } };
  const cam = () => { base(); g.translate(W / 2 + sh[0], H / 2 + sh[1]); g.scale(z, z); g.translate(-1000, -535); };
  g.save();
  if (still) { base(); g.beginPath(); g.rect(0, 0, W, H); g.clip(); }
  const chars = () => {
    // the creature: a black shape crowding the left edge of frame
    const bx = Math.sin(tcc * 7) * 6, by = Math.sin(tcc * 5) * 8;
    const cp = [[-80, -80], [300, -80], [270, 30], [216, 130, 1], [206, 50], [150, 60], [132, 200, 1], [96, 80], [50, 90], [32, 220, 1], [-10, 110], [-80, 130]].map(q => [q[0] + bx, q[1] + by, q[2]]);
    glow(120 + bx, 20 + by, 520, 'rgba(150,60,255,.7)', .7 + .3 * hash(f2, 2));
    shape(() => sp(cp), { fill: '#030308', ow: 10, sh: 0, bk: 0, rw: 7 });
    const lj = [[-80, 470], [0, 400], [30, 300, 1], [60, 410], [100, 430], [118, 350, 1], [140, 470], [90, 600], [-80, 650]].map(q => [q[0] + bx * .5, q[1] - by, q[2]]);
    shape(() => sp(lj), { fill: '#030308', ow: 10, sh: 0, bk: 0, rw: 7 });
    silasClose(t, tcc, p);
  };
  if (fl && kf < 2 && !still) { // ---- ignition impact frames
    cam(); g.fillStyle = kf ? INK : '#eafaff'; g.fillRect(-300, -300, W + 600, H + 600);
    burst(450, 700, kf ? 190 : 280, 2600, kf ? 46 : 32, kf ? '#39b8ff' : INK, f, kf ? 44 : 70);
    silh(chars, kf ? '#0c46d6' : INK); cam();
    for (const [ex, ey, r] of [[1275, 488, 150], [1042, 469, 100]]) { glow(ex, ey, r * 1.6, 'rgba(60,170,255,1)'); glow(ex, ey, r * .6, '#fff'); }
    flame(700, 830, 180, 300, f, 3, 1.3); flame(330, 740, 250, 430, f, 11, 1.3);
    fx.mis = 18; g.restore(); return;
  }
  cam(); g.save(); g.translate(W / 2, H / 2); g.scale(1.14, 1.14); g.translate(-W / 2, -H / 2); g.drawImage(S4.bg, 0, 0); g.restore();
  mist(120, 300, 900, 700, PAL.vio, .35 * (.7 + .3 * hash(f2, 3)) * (1 - .4 * fl));
  if (fl) { mist(450, 760, 1300, 1000, '#1470ff', .38); }
  chars();
  if (fl) { // azure light washes the scene, pushing back the violet
    cam(); g.save(); g.globalCompositeOperation = 'soft-light'; const gr = g.createRadialGradient(450, 740, 60, 450, 740, 1500); gr.addColorStop(0, '#9fe8ff'); gr.addColorStop(.4, '#1b8dff'); gr.addColorStop(1, 'rgba(10,30,120,0)'); g.fillStyle = gr; g.globalAlpha = .5; g.fillRect(-300, -300, W + 600, H + 600); g.restore();
    g.globalAlpha = .3; dots(-100, 200, 1300, H + 100, 20, (x, y) => clamp(1 - Math.hypot(x - 450, y - 740) / 800) * .7, '#bff1ff'); g.globalAlpha = 1;
    for (let i = 0; i < 26; i++) { const k = ((tcc * .5 + hash(i, 1)) % 1), px = 150 + hash(i, 2) * 800 + Math.sin(k * 7 + i) * 40, py = 900 - k * 1000, s = (1 - k) * (5 + hash(i, 3) * 9); g.fillStyle = i % 3 ? '#7fe0ff' : '#fff'; g.beginPath(); poly([[px, py - s * 1.7], [px + s * .6, py], [px, py + s], [px - s * .6, py]]); g.fill(); }
  } else motes(t, 30, '#b9a0ff', 9, 60);
  if (gl > 0 && u < .8 + 2 / 24) { g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = .55; g.fillStyle = '#dff6ff'; g.fillRect(0, 0, W, H); g.globalAlpha = 1; }
  g.restore();
  if (still) { // ---- held comic panel
    base(); g.lineJoin = 'miter'; g.strokeStyle = INK; g.lineWidth = 16; g.strokeRect(0, 0, W, H);
    g.setTransform(1, 0, 0, 1, 0, 0);
    if (hd < .6) { g.globalAlpha = Math.pow(1 - hd / .6, 2); g.fillStyle = '#fff'; g.fillRect(0, 0, W, H); g.globalAlpha = 1; }
  }
  LT.ht = '#0d1433';
  fx.mis = still ? 2.4 : 2 + (fl ? 7 * Math.exp(-db * 9) : 0) + (u > .8 && u < .95 ? 6 : 0); fx.still = still;
}

/* ============ PLAYER ============
   default : inks all 288 frames once (progress bar), then plays them back at a rock-steady 24 fps
   ?live   : draws procedurally in real time instead (no warm-up; smoothness depends on your machine)
   ?export : idle; frames are pulled by render-mp4.cjs through window.renderFrame(i)               */
const cv = document.getElementById('c'), OUT = cv.getContext('2d'), HUD = document.getElementById('h');
const NF = FPS * DUR, Q = new URLSearchParams(location.search);
function render(t) {
  t = clamp(t, 0, DUR - 1e-4);
  const tc = Math.floor(t * 12 + 1e-6) / 12, fx = { mis: 2, still: false };   // characters animate on twos (12 poses/s)
  g = SB.getContext('2d'); g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  g.fillStyle = INK; g.fillRect(0, 0, W, H); JIT = 0;
  if (t < 3) shot1(t, tc, fx); else if (t < 6) shot2(t, tc, fx); else if (t < 9) shot3(t, tc, fx); else shot4(t, tc, fx);
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  present(OUT, fx.mis, fx.still ? 4242 : Math.floor(t * 12));
}
window.renderFrame = i => render((i + .5) / FPS);
window.clipInfo = { W, H, FPS, DUR, frames: NF };
let playing = true, T = 0, last = 0;
const HELP = 'click / space: pause &middot; R: restart &middot; &larr; &rarr;: step frame &middot; F: fullscreen';
function controls() {
  const step = d => { playing = false; T = clamp((Math.floor(T * FPS + 1e-6) + d) / FPS, 0, DUR - 1 / FPS); };
  addEventListener('keydown', e => {
    if (e.code == 'Space') { playing = !playing; e.preventDefault(); }
    else if (e.key == 'r' || e.key == 'R') { T = 0; playing = true; }
    else if (e.key == 'ArrowRight') step(1); else if (e.key == 'ArrowLeft') step(-1);
    else if (e.key == 'f' || e.key == 'F') (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen());
  });
  cv.addEventListener('click', () => { playing = !playing; });
  HUD.innerHTML = HELP; setTimeout(() => HUD.style.opacity = 0, 5000);
}
const tick = now => { if (playing) { T += Math.min(.1, (now - last) / 1000); if (T >= DUR + 1.5) T = 0; } last = now; };   // hold the last panel, then loop
async function init() {
  g = OUT; OUT.fillStyle = '#000'; OUT.fillRect(0, 0, W, H);
  HUD.textContent = 'preparing the Deepwood…'; await new Promise(r => setTimeout(r, 30));
  buildPost(); buildScenes(); window.READY = true;
  if (Q.has('export')) { render(0); return; }
  if (Q.has('live')) {
    controls(); const loop = now => { tick(now); render(Math.min(T, DUR - 1e-3)); requestAnimationFrame(loop); };
    requestAnimationFrame(now => { last = now; loop(now); }); return;
  }
  const blobs = [];
  for (let i = 0; i < NF; i++) {
    renderFrame(i); blobs.push(await new Promise(r => cv.toBlob(r, 'image/jpeg', .94)));
    HUD.textContent = 'inking frame ' + (i + 1) + ' / ' + NF + '  (add ?live to the URL to skip this and draw in real time)';
  }
  const bmp = new Map(); let shown = -1;
  const want = i => { if (!bmp.has(i)) { const e = { b: null }; bmp.set(i, e); createImageBitmap(blobs[i]).then(b => { e.b = b; }); } return bmp.get(i); };
  controls();
  const loop = now => {
    tick(now); const i = Math.min(NF - 1, Math.floor(T * FPS + 1e-6));
    for (let k = 0; k < 8; k++) want((i + k) % NF);
    const e = want(i); if (e.b && i != shown) { OUT.drawImage(e.b, 0, 0); shown = i; }
    for (const [k, v] of bmp) if ((k < i - 2 || k > i + 12) && !(i + 8 >= NF && k < 8)) { if (v.b) v.b.close(); bmp.delete(k); }
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(now => { last = now; loop(now); });
}
setTimeout(init, 30);

</script></body></html>
