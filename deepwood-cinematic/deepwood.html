<script>
'use strict';
/* ==========================================================================
   DEEPWOOD — a 12 s animated graphic-novel clip, drawn entirely by code.
   Canvas2D does all of the inking (shapes, outlines, halftone, brush work);
   a WebGL pass composites a halftoned light layer, print misregistration,
   paper/brush grain, vignette and impact frames.
   Rendering is a pure function of the frame number (24 fps, 288 frames):
   characters are posed on twos, the camera moves on every frame.
   ========================================================================== */
const W = 1920, H = 1080, FPS = 24, DUR = 12, NF = FPS * DUR;
const INK = '#07060d';
const TAU = Math.PI * 2;
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;

const easeIn = t => Math.pow(clamp(t), 3);
const easeIO = t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };

function RNG(seed) { let s = (Math.imul(seed | 0, 2654435761) ^ 0x9E3779B9) >>> 0 || 1;
  return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
const gauss = (x, m, w) => { const d = (x - m) / w; return Math.exp(-d * d); };

/* ---------- colour ---------- */
const _hx = new Map();
function hex(c) { let v = _hx.get(c); if (v) return v; let s = c.replace('#', '');
  if (s.length === 3) s = s.split('').map(x => x + x).join(''); const n = parseInt(s, 16);

/* ---------- geometry ---------- */
// Catmull-Rom through control points. A control point [x,y,1] is a sharp corner.

}

}
function path(ctx, p, closed = true) { if (!p.length) return; ctx.moveTo(p[0][0], p[0][1]); for (let i = 1; i < p.length; i++) ctx.lineTo(p[i][0], p[i][1]); if (closed) ctx.closePath(); }

function xf(p, x, y, a = 0, sx = 1, sy = sx) { const c = Math.cos(a), s = Math.sin(a);
  return p.map(q => [x + q[0] * sx * c - q[1] * sy * s, y + q[0] * sx * s + q[1] * sy * c]); }
function jit(p, amt, seed) { if (!amt) return p; return p.map((q, i) => [q[0] + noise(i * .31 + seed * 17.17) * amt, q[1] + noise(i * .29 + seed * 9.31 + 50) * amt]); }

const rot = (x, y, a) => [x * Math.cos(a) - y * Math.sin(a), x * Math.sin(a) + y * Math.cos(a)];
const ellipse = (cx, cy, rx, ry, a = 0, n = 28) => { const o = []; for (let i = 0; i < n; i++) { const t = i / n * TAU; const v = rot(Math.cos(t) * rx, Math.sin(t) * ry, a); o.push([cx + v[0], cy + v[1]]); } return o; };

function capsule(x1, y1, r1, x2, y2, r2, seg = 9) {

}
// variable-radius tube along a dense centre line; returns closed outline
function tube(c, rad, capA = true, capB = true) {
  const n = c.length, L = [], R = [];

    const a = c[Math.max(0, i - 1)], b = c[Math.min(n - 1, i + 1)];
    const tx = b[0] - a[0], ty = b[1] - a[1], l = Math.hypot(tx, ty) || 1, nx = -ty / l, ny = tx / l;

    L.push([c[i][0] + nx * r, c[i][1] + ny * r]); R.push([c[i][0] - nx * r, c[i][1] - ny * r]);
  }

    for (let k = 1; k < 8; k++) { const t = a + Math.PI / 2 - Math.PI * k / 8; out.push([e[0] + Math.cos(t) * r, e[1] + Math.sin(t) * r]); } }
  for (let i = n - 1; i >= 0; i--) out.push(R[i]);
  if (capA) { const e = c[0], p = c[1], a = Math.atan2(e[1] - p[1], e[0] - p[0]), r = Math.hypot(L[0][0] - e[0], L[0][1] - e[1]);
    for (let k = 1; k < 8; k++) { const t = a + Math.PI / 2 - Math.PI * k / 8; out.push([e[0] + Math.cos(t) * r, e[1] + Math.sin(t) * r]); } }

}
// integrate a centre line from angles: start point, length, angle(s) function
function chain(x, y, len, angFn, n = 24) { const o = [[x, y]]; for (let i = 1; i <= n; i++) { const s = (i - .5) / n, a = angFn(s); x += Math.cos(a) * len / n; y += Math.sin(a) * len / n; o.push([x, y]); } return o; }

/* ---------- ink toolkit ---------- */
// Inked shape: variable-weight outline (heavier on the side facing away from light L) + flat fill.
function ink(ctx, p, fill, w, L = [.6, -.8], o = {}) {

    const N = normals(p), varw = o.varw ?? .75, seed = o.seed ?? 0, base = o.base ?? .38;
    ctx.beginPath();
    for (let i = 0; i < p.length; i++) {
      const n = N[i], sh = Math.max(0, -(n[0] * L[0] + n[1] * L[1]));
      const k = w * (base + varw * sh * sh + .22 * noise(i * .23 + seed * 13.7));
      const x = p[i][0] + n[0] * k, y = p[i][1] + n[1] * k; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.closePath(); ctx.fillStyle = o.inkCol || INK; ctx.fill();
    ctx.lineJoin = 'round'; ctx.lineWidth = w * .55; ctx.strokeStyle = o.inkCol || INK;
    ctx.beginPath(); path(ctx, p); ctx.stroke();

}
// inside clip of p: fill region of p NOT covered by p shifted by (dx,dy)
function cut(ctx, p, dx, dy, style, sc = 1) {
  ctx.beginPath(); ctx.rect(-1e5, -1e5, 2e5, 2e5);

}
function clipTo(ctx, p, fn) { ctx.save(); ctx.beginPath(); path(ctx, p); ctx.clip(); fn(); ctx.restore(); }
/* Toon shading for a flat shape lit from direction L (unit vector toward light).

  ctx.save(); ctx.beginPath(); path(ctx, p); ctx.clip();

// screen-locked halftone pattern (diamond lattice) — printed dots stay on the "page"

function htField(ctx, clipP, fn, sp, color, bb) {

  const b = bb || bbox(clipP); ctx.beginPath(); let row = 0;
  for (let y = b[1] - sp; y < b[3] + sp; y += sp * .866, row++) {

<script>
'use strict';
/* ==========================================================================
   COMPOSITOR — main colour layer + light layer → WebGL print pass
   ========================================================================== */
const OUT = document.getElementById('out');
const MAIN = mk(W, H), LIGHT = mk(W, H);
const m = MAIN.getContext('2d'), lg = LIGHT.getContext('2d');
let GL = null, glProg = null, glTex = [], glU = {};
const FS = `#version 300 es
precision highp float;
uniform sampler2D uMain, uLight;
uniform vec2 uRes; uniform float uFrame, uMis, uHT, uImpact, uFlash, uVig, uGrain, uHTAng;
uniform vec3 uImpA, uImpB, uFlashCol; uniform float uImpTh;
in vec2 vUv; out vec4 o;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
void main(){
  vec2 px=1./uRes, uv=vUv, fc=gl_FragCoord.xy;
  // --- print misregistration: colour plates slightly off-register ---
  vec2 o1=vec2(uMis,uMis*.55)*px, o2=vec2(-uMis*.6,uMis*.8)*px;
  vec3 col=vec3(texture(uMain,uv+o1).r, texture(uMain,uv).g, texture(uMain,uv+o2).b);
  // --- light layer → halftone screen (dots grow with intensity, merge to solid) ---
  vec3 L=texture(uLight,uv).rgb; float I=max(L.r,max(L.g,L.b));
  float a=uHTAng; mat2 R=mat2(cos(a),-sin(a),sin(a),cos(a));
  vec2 q=R*fc/uHT; vec2 ce=fract(q)-.5; float d=length(ce);
  float rad=sqrt(clamp(I,0.,1.2))*.74;
  float dm=1.-smoothstep(rad-.07,rad+.07,d);
  vec3 hue=L/max(I,1e-4);
  vec3 add=L*.42+hue*dm*clamp(I*1.5,0.,1.)*.92;
  add=clamp(add,0.,1.);
  col=1.-(1.-col)*(1.-add);
  // --- paper, fibre, painterly brush grain ---
  float paper=vn(fc*.8)*.5+vn(fc*.21)*.5;
  float fib=vn(vec2(fc.x*.03+fc.y*.01,fc.y*.45));
  float br=vn(vec2(fc.x*.004+fc.y*.0015,fc.y*.022+fc.x*.001))*.6+vn(vec2(fc.x*.011,fc.y*.05))*.4;
  col*=.955+.05*paper; col*=.97+.035*fib; col*=.93+.11*br;
  float gr=h(fc+vec2(floor(uFrame*.5)*13.17,floor(uFrame*.5)*7.31));
  col+=(gr-.5)*uGrain;

  if(uImpact>.5){ float lum=dot(col,vec3(.3,.59,.11)); col=mix(uImpB,uImpA,step(uImpTh,lum)); }
  col=mix(col,uFlashCol,uFlash);
  vec2 vv=uv-.5; col*=1.-dot(vv*vec2(1.,.8),vv*vec2(1.,.8))*uVig;
  o=vec4(clamp(col,0.,1.),1.);
}`;

function initGL() {

    if (!GL) return false;
    const g = GL, sh = (t, s) => { const x = g.createShader(t); g.shaderSource(x, s); g.compileShader(x);

    g.linkProgram(glProg); if (!g.getProgramParameter(glProg, g.LINK_STATUS)) throw new Error(g.getProgramInfoLog(glProg));
    g.useProgram(glProg);
    const b = g.createBuffer(); g.bindBuffer(g.ARRAY_BUFFER, b); g.bufferData(g.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), g.STATIC_DRAW);
    const loc = g.getAttribLocation(glProg, 'p'); g.enableVertexAttribArray(loc); g.vertexAttribPointer(loc, 2, g.FLOAT, false, 0, 0);
    for (let i = 0; i < 2; i++) { const t = g.createTexture(); g.activeTexture(g.TEXTURE0 + i); g.bindTexture(g.TEXTURE_2D, t);
      g.texParameteri(g.TEXTURE_2D, g.TEXTURE_MIN_FILTER, g.LINEAR); g.texParameteri(g.TEXTURE_2D, g.TEXTURE_MAG_FILTER, g.LINEAR);
      g.texParameteri(g.TEXTURE_2D, g.TEXTURE_WRAP_S, g.CLAMP_TO_EDGE); g.texParameteri(g.TEXTURE_2D, g.TEXTURE_WRAP_T, g.CLAMP_TO_EDGE); glTex.push(t); }
    for (const n of ['uMain', 'uLight', 'uRes', 'uFrame', 'uMis', 'uHT', 'uImpact', 'uFlash', 'uVig', 'uGrain', 'uHTAng', 'uImpA', 'uImpB', 'uFlashCol', 'uImpTh']) glU[n] = g.getUniformLocation(glProg, n);

<script>
'use strict';
/* ==========================================================================
   FRAME DISPATCH + PLAYER
   ========================================================================== */
const SHOTS = [
  { f0: 0, f1: 72, fn: (t, tc, f, P) => shot1(t, tc, f, P) },
  { f0: 72, f1: 144, fn: (t, tc, f, P) => (typeof shot2 === 'function' ? shot2 : stub)(t, tc, f, P) },
  { f0: 144, f1: 216, fn: (t, tc, f, P) => (typeof shot3 === 'function' ? shot3 : stub)(t, tc, f, P) },
  { f0: 216, f1: 288, fn: (t, tc, f, P) => (typeof shot4 === 'function' ? shot4 : stub)(t, tc, f, P) },
];
function stub(t) { m.fillStyle = '#123'; m.fillRect(0, 0, W, H); }
function renderFrame(f) {
  f = Math.max(0, Math.min(NF - 1, f | 0));
  resetCtx();
  const P = defaultPost();
  const S = SHOTS.find(s => f >= s.f0 && f < s.f1);
  const lf = f - S.f0, t = lf / FPS, tc = Math.floor(lf / 2) * 2 / FPS; // tc: character time, on twos
  S.fn(t, tc, lf, P);

  return f;
}
window.renderFrame = renderFrame; window.DEEPWOOD_NF = NF;

(async function init() {
  const hasGL = initGL();
  const steps = [buildShot1, () => typeof buildShot2 === 'function' && buildShot2(), () => typeof buildShot3 === 'function' && buildShot3(), () => typeof buildShot4 === 'function' && buildShot4()];
  const ld = document.getElementById('loading');
  for (let i = 0; i < steps.length; i++) { ld.textContent = `INKING THE DEEPWOOD… ${Math.round(i / steps.length * 100)}%`; await new Promise(r => setTimeout(r, 0)); steps[i](); }
  ld.style.display = 'none';
  window.DEEPWOOD_READY = true;
  if (location.search.includes('render')) { renderFrame(0); return; }
  // ---- realtime player: 24 fps timeline, hold the final panel, loop ----
  const HOLD = FPS * 2; let playing = true, base = performance.now(), cur = -1, pausedAt = 0;
  const bar = document.querySelector('#bar i'), tcEl = document.getElementById('tc'), pp = document.getElementById('pp');
  const frameAt = now => Math.floor((now - base) / 1000 * FPS) % (NF + HOLD);
  function seek(f) { base = performance.now() - f / FPS * 1000; if (!playing) pausedAt = f; cur = -1; }
  function loop(now) {
    let f = playing ? frameAt(now) : pausedAt; f = Math.min(f, NF - 1);
    if (f !== cur) { cur = f; renderFrame(f); bar.style.width = (f / (NF - 1) * 100) + '%'; tcEl.textContent = `${(f / FPS).toFixed(2)}s · f${f}`; }
    requestAnimationFrame(loop);
  }
  const toggle = () => { if (playing) { pausedAt = Math.min(frameAt(performance.now()), NF - 1); playing = false; pp.textContent = '▶'; } else { playing = true; seek(pausedAt); pp.textContent = '❚❚'; } };

  });

})();
